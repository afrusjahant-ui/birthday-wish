<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Saba ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* মেইন ব্যাকগ্রাউন্ড গ্রিড ও থিম */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe5ec;
            background-image: linear-gradient(#ffccd5 1px, transparent 1px), linear-gradient(90deg, #ffccd5 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .page {
            display: none;
            width: 100%;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        .active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- PAGE 1: FRONT PAGE --- */
        .front-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 50px;
            flex-wrap: wrap;
            position: relative;
            padding: 20px;
        }

        .front-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            min-width: 320px;
            z-index: 10;
        }

        .front-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            min-width: 300px;
            z-index: 5;
        }

        /* হ্যাপি বার্থডে টেক্সট ও টুপির কন্টেইনার */
        .hb-container {
            position: relative;
            display: inline-block;
            margin-top: 30px; /* টুপির জায়গার জন্য একটু নিচে নামালাম */
        }

        /* স্ক্রিনশটের মতো বাঁকা বার্থডে ক্যাপ */
        .birthday-cap {
            position: absolute;
            top: -42px;
            left: 25px;
            font-size: 55px;
            transform: rotate(-25deg);
            z-index: 15;
            filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.15));
            pointer-events: none;
        }

        .giant-hb {
            font-family: 'Fredoka One', cursive;
            font-size: 75px;
            color: #ff4d6d;
            line-height: 80px;
            margin: 0 0 20px 0;
            text-shadow: 4px 4px 0px #fff;
            -webkit-text-stroke: 2px #333;
        }

        .date-badge {
            background: #ff758f;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            padding: 8px 30px;
            border-radius: 50px;
            border: 3px solid #333;
            box-shadow: 4px 4px 0px #333;
            margin-bottom: 25px;
        }

        /* Click Here Saba Button */
        .action-btn {
            background: #ff4d6d;
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            padding: 12px 35px;
            border-radius: 50px;
            border: 3px solid #333;
            box-shadow: 4px 4px 0px #333;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 20;
        }

        .action-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #333;
        }

        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #333;
        }

        /* প্রোফাইল ইমেজ */
        .profile-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gf-circle-img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #333;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
            background: white;
        }

        .name-tag {
            background: #fff;
            color: #ff4d6d;
            font-family: 'Pacifico', cursive;
            font-size: 26px;
            padding: 5px 40px;
            border-radius: 50px;
            border: 3px solid #333;
            box-shadow: 4px 4px 0px #333;
            margin-top: -25px;
            z-index: 5;
        }

        /* --- স্ক্রিনশটের মতো রিয়ালিস্টিক থ্রিডি গ্লসি ব্যালুন --- */
        .real-balloon {
            position: absolute;
            width: 75px;
            height: 90px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            z-index: 2;
            animation: float 4s ease-in-out infinite;
        }
        /* ব্যালুনের গ্লসি রিফ্লেকশন স্পট */
        .real-balloon::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 15px;
            width: 15px;
            height: 25px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-15deg);
        }
        /* ব্যালুনের নিচের গিঁট/সুতা বাধার জায়গা */
        .real-balloon::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 33px;
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 8px solid currentColor;
            transform: rotate(180deg);
        }

        /* ব্যালুন কালার ও লাইটিং ইফেক্ট */
        .rb-pink {
            background: radial-gradient(circle at 30% 30%, #ff758f, #ff4d6d, #c9184a);
            color: #ff4d6d;
            top: -40px;
            left: -50px;
            animation-delay: 0s;
        }
        .rb-purple {
            background: radial-gradient(circle at 30% 30%, #e0aaff, #9d4edd, #5a189a);
            color: #9d4edd;
            top: 60px;
            right: -60px;
            animation-delay: 1.5s;
        }
        
        .bunting-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25px;
            background-image: linear-gradient(45deg, #ff758f 25%, transparent 25%), linear-gradient(-45deg, #ff758f 25%, transparent 25%);
            background-size: 30px 60px;
            opacity: 0.7;
            z-index: 1;
            pointer-events: none;
        }

        /* --- PAGE 2: OPENING DIARY / CARD --- */
        .diary-container {
            display: flex;
            width: 100%;
            max-width: 800px;
            background: #fff;
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 12px 12px 0px rgba(0,0,0,0.15);
            overflow: hidden;
            min-height: 480px;
        }

        .diary-left {
            flex: 1;
            background: #ff758f;
            border-right: 4px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }

        .diary-right {
            flex: 1.4;
            background: #fff9e6;
            background-image: repeating-linear-gradient(#fff9e6 0px, #fff9e6 29px, #d1ccb9 30px);
            padding: 35px;
            text-align: left;
            line-height: 30px;
            color: #2b2b2b;
            font-family: 'Caveat', cursive;
            font-size: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- PAGE 3: TYPEWRITER PRAYERS --- */
        .prayer-card {
            background: white;
            border: 4px solid #333;
            border-radius: 20px;
            box-shadow: 8px 8px 0px #333;
            padding: 40px;
            width: 100%;
            max-width: 750px;
        }

        /* --- PAGE 4: QUEEN & SPOTIFY PLAYER --- */
        .queen-card {
            background: white;
            border: 4px solid #333;
            border-radius: 25px;
            box-shadow: 10px 10px 0px #333;
            padding: 40px;
            width: 100%;
            max-width: 850px;
        }

        .crown-container {
            position: relative;
            display: inline-block;
        }
        .crown {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 55px;
            z-index: 10;
            animation: spinCrown 3s linear infinite;
        }

        .gf-rect-img {
            width: 100%;
            max-width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid #333;
        }

            background: #282828;
            color: white;
            width: 100%;
            max-width:
